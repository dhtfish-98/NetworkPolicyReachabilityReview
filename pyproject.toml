[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cvp-network-policy-reachability-review"
version = "0.1.2"
authors = [{name = "dhtfish98"}]
description = "Complete declared Kubernetes networking.k8s.io/v1 NetworkPolicy profile evaluated offline against a bounded topology and explicit directional connection questions."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "UPSTREAM_LICENSE"]
readme = "README.md"
dependencies = []
[project.scripts]
network-policy-reachability-review = "network_policy_reachability_review.cli:entry"
[tool.setuptools.packages.find]
where = ["src"]
